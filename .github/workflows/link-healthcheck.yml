name: 앱 링크 헬스체크 (portal 자체 포함)

permissions:
  contents: read
  issues: write

on:
  schedule:
    # 매일 09:00 KST(UTC 00:00) — 6개 앱 링크가 살아있는지 확인
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        # 아래 OG 이미지 대조가 포털이 보관한 원본(public/assets/og/*.jpg)과
        # 비교해야 해서 저장소 체크아웃이 필요하다. 나머지 검사는 원래
        # 체크아웃 없이도 됐다.
      - name: 링크 6개 상태 + 내용 확인
        run: |
          # HTTP 200만으로는 부족하다 — classcade가 실제로 겪었던 것처럼(2026-08-17,
          # 배포 환경변수 누락) 200을 받으면서도 기능이 죽어있는 경우가 있었음.
          # 그래서 상태코드에 더해 응답 본문에 그 앱의 고유 문자열이 실제로
          # 들어있는지까지 확인한다.
          #
          # 그래도 못 잡는 게 있다 — "페이지가 뜬다"는 "앱이 된다"가 아니다
          # (COMMON_STANDARDS §21-5, 2026-09-10). 이 검사는 정적 HTML만 보고
          # 백엔드·인증을 아예 건드리지 않아서, 2026-09-10에 AI Ways Incheon의
          # 학교 검색 함수가 Firebase App Check 토큰을 못 만들어 실사용자 전원이
          # 못 쓰는 상태였는데도 9/9 01:58부터 계속 초록불이었다. 아래
          # check_function이 그 구멍을 메운다 — 실제 백엔드 함수를 인증 없이
          # 불러서 "정확히 그 실패 코드"가 오는지 본다. 아무 응답이나 받는 게
          # 아니라 **허용목록**이다: 함수가 살아 있고 배포돼 있고 오리진이
          # 허용돼 있고 App Check 검사까지 도달했다는 뜻인 401
          # app_check_missing이 아니면 전부 실패로 잡는다(!= 500 같은 배제
          # 방식은 안 씀). 일부러 없는 함수 이름/호스트로 바꿔 실제로 빨간불이
          # 뜨는 것까지 확인했다(404로 갈림, §21-2).
          #
          # Poster Studio/CLASSCADE/Be a Googler도 백엔드가 있지만, 이 저장소
          # 밖에서 그 앱들의 정확한 엔드포인트·기대 응답 계약을 확신 있게
          # 알아낼 수 없어서(포스터 스튜디오는 Cloud Function은 찾았지만 정확한
          # 하위 경로를 못 찾음, CLASSCADE·Be a Googler는 초기 로드에서 백엔드
          # 호출 자체가 안 보임) 지금은 AI Ways 하나만 추가한다. 억지로 만든
          # 검사보다 없는 게 낫다.
          : > /tmp/failures.txt
          check() {
            local name="$1" url="$2" expect="$3"
            local body code
            body=$(curl -sL --max-time 15 "$url")
            code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 15 "$url")
            echo "$name: $code ($url)"
            if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
              echo "::error::$name 응답 실패 — HTTP $code ($url)"
              echo "- **$name**: HTTP $code ($url)" >> /tmp/failures.txt
              return 1
            fi
            if ! echo "$body" | grep -qF "$expect"; then
              echo "::error::$name 응답에 예상 문자열('$expect')이 없음 — HTTP는 정상이지만 내용이 깨졌을 수 있음 ($url)"
              echo "- **$name**: HTTP $code 정상이지만 예상 문자열('$expect') 없음 ($url)" >> /tmp/failures.txt
              return 1
            fi
          }
          check_function() {
            local name="$1" url="$2" expect_code="$3" expect_body="$4"
            local response body code short_body
            # 본문·상태코드를 curl 한 번으로 같이 받는다 — 예전엔 두 번 따로
            # 불러서, 롤링 배포·간헐 장애 중이면 서로 다른 요청의 응답을
            # 섞어서 "상태코드는 맞는데 본문은 다른 것"이라는 실제로는 한 번도
            # 함께 일어나지 않은 조합을 보고할 수 있었다(2026-09-10 감사에서 발견).
            response=$(curl -sL --max-time 15 -X POST "$url" -H "Content-Type: application/json" -d '{}' -w $'\n%{http_code}')
            code=$(printf '%s' "$response" | tail -n1)
            body=$(printf '%s' "$response" | sed '$d')
            # 이 본문은 남의 프로젝트가 돌려준 응답이라 스택트레이스·내부
            # 식별자가 섞여 있을 수 있다 — 실패 시 공개 저장소의 GitHub 이슈로
            # 그대로 실리므로(2026-09-10 감사에서 발견) 200자로 자른다.
            short_body="${body:0:200}"
            echo "$name (기능): $code ($url)"
            if [ "$code" != "$expect_code" ]; then
              echo "::error::$name 기능 확인 실패 — 상태코드 $code, 기대 $expect_code ($url)"
              echo "- **$name (기능)**: 상태코드 $code, 기대 $expect_code ($url)" >> /tmp/failures.txt
              return 1
            fi
            if ! echo "$body" | grep -qF "$expect_body"; then
              echo "::error::$name 기능 확인 실패 — 상태코드는 기대값이지만 응답 본문에 '$expect_body'가 없음: $short_body ($url)"
              echo "- **$name (기능)**: 응답 본문 불일치 — $short_body ($url)" >> /tmp/failures.txt
              return 1
            fi
          }
          check_og_image() {
            # 2026-09-10, 팀장 지시 — 포털이 6개 앱의 카카오톡 공유 이미지 원본을
            # 만들어 각 앱에 넘겼는데(자기호스팅 방식, AGENTS.md 참고), 넘긴 뒤에
            # 카드 썸네일이 바뀌면(예: 9/9 QUIZ 재인코딩) 각 앱이 자기 도메인에
            # 넣어둔 사본이 조용히 옛 그림으로 남아도 잡을 방법이 없었다(종합감사
            # ①에서 발견). 여기서 다른 저장소를 건드리지 않고, 포털이 자기가
            # 만든 원본과 각 앱의 배포본을 바이트 해시로 대조한다 — 아직 원본을
            # 적용하지 않은 앱(og:image가 아예 없거나 다른 이미지)도 같은 방식으로
            # 걸린다.
            local name="$1" page_url="$2" local_ref="$3"
            local html image_url remote_hash local_hash
            html=$(curl -sL --max-time 15 "$page_url")
            image_url=$(echo "$html" | grep -oP '(?<=property="og:image" content=")[^"]+' | head -n1)
            if [ -z "$image_url" ]; then
              echo "::error::$name og:image 메타 태그를 찾지 못함 ($page_url)"
              echo "- **$name (OG 이미지)**: og:image 태그 없음 ($page_url)" >> /tmp/failures.txt
              return 1
            fi
            remote_hash=$(curl -sL --max-time 15 "$image_url" | sha256sum | awk '{print $1}')
            local_hash=$(sha256sum "$local_ref" | awk '{print $1}')
            echo "$name (OG 이미지): $([ "$remote_hash" = "$local_hash" ] && echo 일치 || echo 불일치) ($image_url)"
            if [ "$remote_hash" != "$local_hash" ]; then
              echo "::error::$name의 배포된 og:image가 포털 원본과 다름 — 아직 최신 원본을 안 받았거나 원본이 바뀐 뒤 갱신을 안 한 것일 수 있음 ($image_url)"
              echo "- **$name (OG 이미지)**: 배포본과 포털 원본 해시 불일치 ($image_url)" >> /tmp/failures.txt
              return 1
            fi
          }
          failed=0
          check "PORTAL(edutogether.kr 자기 자신)" "https://edutogether.kr/" "같교오락실" || failed=1
          check "QUIZ TOGETHER" "https://joo.is/%EA%B0%99%EC%9D%B4%EA%B5%90%EC%9C%A1%ED%80%B4%EC%A6%88" "같이교육 퀴즈" || failed=1
          check "CLASSCADE" "https://classcade.edutogether.kr" "CLASSCADE" || failed=1
          check "AI Ways Incheon" "https://incheon.edutogether.kr" "AI Ways Incheon" || failed=1
          check_function "AI Ways Incheon searchSchool" "https://asia-northeast3-ai-ways-incheon.cloudfunctions.net/searchSchool" "401" '"code":"app_check_missing"' || failed=1
          check "Be a Googler" "https://googler.edutogether.kr" "Be a Googler" || failed=1
          check "Poster Studio" "https://poster.edutogether.kr" "InKY Poster Studio" || failed=1
          check "Voice Cinema" "https://voice.edutogether.kr" "InKY Voice Cinema" || failed=1
          check_og_image "Portal 자신" "https://edutogether.kr/" "public/assets/og/portal.jpg" || failed=1
          check_og_image "Poster Studio" "https://poster.edutogether.kr/" "public/assets/og/poster.jpg" || failed=1
          check_og_image "Voice Cinema" "https://voice.edutogether.kr/" "public/assets/og/voice.jpg" || failed=1
          check_og_image "CLASSCADE" "https://classcade.edutogether.kr/" "public/assets/og/classcade.jpg" || failed=1
          check_og_image "AI Ways Incheon" "https://incheon.edutogether.kr/" "public/assets/og/incheon.jpg" || failed=1
          check_og_image "Be a Googler" "https://googler.edutogether.kr/" "public/assets/og/googler.jpg" || failed=1
          # QUIZ TOGETHER는 외부 Google Apps Script 서비스라 og 태그를 넣을 수
          # 없어 대상에서 제외한다(link-healthcheck.yml 위 주석·CLAUDE.md 참고).
          exit $failed

      - name: 실패 시 GitHub 이슈 자동 생성
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 며칠씩 계속 실패해도 매일 새 이슈를 만들지 않도록, 이미 열린
          # healthcheck-failure 라벨 이슈가 있으면 새로 만들지 않고 넘어간다.
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label healthcheck-failure --state open --json number --jq 'length')
          if [ "$existing" -gt 0 ]; then
            echo "이미 열린 헬스체크 실패 이슈가 있어 새로 만들지 않음"
            exit 0
          fi
          {
            echo "자동 헬스체크가 실패했습니다. [실행 로그]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo ""
            cat /tmp/failures.txt
          } > /tmp/issue-body.txt
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "🔴 앱 링크 헬스체크 실패 ($(date -u +%Y-%m-%d))" \
            --label healthcheck-failure \
            --assignee 817beatles \
            --body-file /tmp/issue-body.txt
