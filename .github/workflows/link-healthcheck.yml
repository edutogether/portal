name: 앱 링크 헬스체크 (portal 자체 포함)

permissions:
  contents: read
  issues: write

on:
  schedule:
    # 매일 09:00 KST(UTC 00:00) — 6개 앱 링크가 살아있는지 확인
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: 링크 6개 상태 + 내용 확인
        run: |
          # HTTP 200만으로는 부족하다 — classcade가 실제로 겪었던 것처럼(2026-08-17,
          # 배포 환경변수 누락) 200을 받으면서도 기능이 죽어있는 경우가 있었음.
          # 그래서 상태코드에 더해 응답 본문에 그 앱의 고유 문자열이 실제로
          # 들어있는지까지 확인한다.
          : > /tmp/failures.txt
          check() {
            local name="$1" url="$2" expect="$3"
            local body code
            body=$(curl -sL --max-time 15 "$url")
            code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 15 "$url")
            echo "$name: $code ($url)"
            if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
              echo "::error::$name 응답 실패 — HTTP $code ($url)"
              echo "- **$name**: HTTP $code ($url)" >> /tmp/failures.txt
              return 1
            fi
            if ! echo "$body" | grep -qF "$expect"; then
              echo "::error::$name 응답에 예상 문자열('$expect')이 없음 — HTTP는 정상이지만 내용이 깨졌을 수 있음 ($url)"
              echo "- **$name**: HTTP $code 정상이지만 예상 문자열('$expect') 없음 ($url)" >> /tmp/failures.txt
              return 1
            fi
          }
          failed=0
          check "PORTAL(edutogether.kr 자기 자신)" "https://edutogether.kr/" "같교오락실" || failed=1
          check "QUIZ TOGETHER" "https://joo.is/%EA%B0%99%EC%9D%B4%EA%B5%90%EC%9C%A1%ED%80%B4%EC%A6%88" "같이교육 퀴즈" || failed=1
          check "CLASSCADE" "https://edutogether.github.io/classcade/" "CLASSCADE" || failed=1
          check "AI Ways Incheon" "https://edutogether.github.io/aiways-incheon/" "AI Ways Incheon" || failed=1
          check "Be a Googler" "https://edutogether.github.io/googler/" "Be a Googler" || failed=1
          check "Poster Studio" "https://edutogether.github.io/poster-studio/" "InKY AI 영화 포스터 제작소" || failed=1
          check "Voice Cinema" "https://edutogether.github.io/voice-cinema/" "잉키 보이스 시네마" || failed=1
          exit $failed

      - name: 실패 시 GitHub 이슈 자동 생성
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 며칠씩 계속 실패해도 매일 새 이슈를 만들지 않도록, 이미 열린
          # healthcheck-failure 라벨 이슈가 있으면 새로 만들지 않고 넘어간다.
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label healthcheck-failure --state open --json number --jq 'length')
          if [ "$existing" -gt 0 ]; then
            echo "이미 열린 헬스체크 실패 이슈가 있어 새로 만들지 않음"
            exit 0
          fi
          {
            echo "자동 헬스체크가 실패했습니다. [실행 로그]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo ""
            cat /tmp/failures.txt
          } > /tmp/issue-body.txt
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "🔴 앱 링크 헬스체크 실패 ($(date -u +%Y-%m-%d))" \
            --label healthcheck-failure \
            --assignee 817beatles \
            --body-file /tmp/issue-body.txt
