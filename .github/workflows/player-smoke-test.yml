name: 재생 로직 스모크 테스트

# 완벽한 커버리지가 목표가 아니라, 이미 3번 반복됐던 같은 유형 재생 버그
# (모바일 남은시간 초기화 누락 2026-08-23, 볼륨 0에서 음소거 해제 시
# 최대음량 2026-08-25, 반복꺼짐+단일곡 무한재생 2026-08-25)의 4번째 재발을
# 자동으로 잡는 게 목표. index.html은 그대로 빌드 없는 정적 파일이고,
# 이 워크플로우만 테스트 목적으로 node/playwright를 씀(배포엔 영향 없음).
#
# main push에서는 안 돈다 — 2026-08-29 deploy.yml 전환 이후 그 워크플로우의
# test job이 배포 전 게이트로 동일한 검사를 이미 돌리기 때문에, push 트리거를
# 남겨두면 커밋 하나당 같은 테스트가 중복 실행된다. PR 검토 시점의 사전
# 검증 용도로만 pull_request에서 돈다(2026-09-01 정리).

on:
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: 의존성 설치
        run: npm ci
      - name: Playwright 브라우저 설치
        run: npx playwright install --with-deps chromium
      - name: 테스트 실행
        run: npx playwright test
