name: 재생 로직 스모크 테스트

# 완벽한 커버리지가 목표가 아니라, 이미 3번 반복됐던 같은 유형 재생 버그
# (모바일 남은시간 초기화 누락 2026-08-23, 볼륨 0에서 음소거 해제 시
# 최대음량 2026-08-25, 반복꺼짐+단일곡 무한재생 2026-08-25)의 4번째 재발을
# 자동으로 잡는 게 목표. 테스트는 빌드된 dist/를 대상으로 돌기 때문에 먼저
# npm run build가 필요하다(2026-09-08 리액트 전환 이후).
#
# main push에서는 안 돈다 — 2026-08-29 deploy.yml 전환 이후 그 워크플로우의
# test job이 배포 전 게이트로 동일한 검사를 이미 돌리기 때문에, push 트리거를
# 남겨두면 커밋 하나당 같은 테스트가 중복 실행된다. PR 검토 시점의 사전
# 검증 용도로만 pull_request에서 돈다(2026-09-01 정리).

on:
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: 의존성 설치
        run: npm ci
      - name: 빌드
        run: npm run build
      - name: Playwright 버전 확인
        id: playwright-version
        # 명령치환 실패가 바깥 echo에 가려지면(2026-09-10 감사에서 발견) 빈
        # 버전으로 캐시 키가 만들어지고, 다음에도 그 빈 키에 계속 히트해
        # 설치 스텝이 조용히 스킵될 위험이 있다 — 빈 값이면 그 자리에서
        # 실패시킨다.
        run: |
          version=$(npx playwright --version | awk '{print $2}')
          if [ -z "$version" ]; then
            echo "::error::Playwright 버전을 확인하지 못했습니다 (빈 값)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Playwright 브라우저 캐시
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
      - name: Playwright 브라우저 설치
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        # deploy.yml과 같은 이유로 --with-deps를 뗐다(2026-09-10) — apt는 시스템
        # 라이브러리에만 쓰이는데 ubuntu-latest에는 이미 대부분 있고, 브라우저
        # 바이너리는 Playwright 자체 CDN에서 HTTPS로 받는다. 자세한 경위는
        # .claude/rules/app.md 참고.
        run: npx playwright install chromium
      - name: 테스트 실행
        run: npm test
