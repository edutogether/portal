name: index.html / 404.html 동기화 확인

# 이 사이트는 빌드 과정이 없어서 404.html이 index.html의 수동 복사본이다.
# CLAUDE.md에 "고칠 때마다 cp index.html 404.html 잊지 말 것"이라고만
# 적혀있어 사람 기억에만 의존하고 있었는데, 그 대신 push할 때마다 자동으로
# 확인해서 둘이 달라지면 바로 잡아낸다.
#
# main push에서는 안 돈다 — 2026-08-29 deploy.yml 전환 이후 그 워크플로우의
# test job이 배포 전 게이트로 동일한 확인을 이미 돌리기 때문에, push 트리거를
# 남겨두면 커밋 하나당 같은 검사가 중복 실행된다. PR 검토 시점의 사전 검증
# 용도로만 pull_request에서 돈다(2026-09-01 정리).

on:
  pull_request:
    branches: [main]

jobs:
  check-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: index.html과 404.html이 동일한지 확인
        run: |
          if ! cmp -s public/index.html public/404.html; then
            echo "::error::index.html과 404.html이 서로 다릅니다. index.html을 고쳤다면 'cp public/index.html public/404.html'을 잊은 것입니다."
            exit 1
          fi
          echo "index.html과 404.html 동일함 — OK"
      - name: CSP script-src 해시가 실제 스크립트와 일치하는지 확인
        run: python3 scripts/check-csp-hash.py
