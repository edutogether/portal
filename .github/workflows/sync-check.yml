name: 빌드 산출물 확인 (404 복사 + 인라인 script 없음)

# 404.html은 빌드가 index.html을 복사해서 만든다(vite.config.ts의 copy-index-to-404).
# 예전에는 사람이 손으로 cp 하던 거라 잊으면 사고였고, 그래서 이 검사가 생겼다.
# 이제는 잊을 수가 없는 구조지만, 플러그인이 조용히 빠지는 경우를 잡으려고 안전망으로
# 남겨둔다.
#
# 인라인 script 검사는 CSP가 script-src 'self'라서 필요하다 — 인라인 스크립트가
# 들어오면 브라우저가 조용히 차단한다(scripts/check-inline-script.py 주석 참고).
#
# main push에서는 안 돈다 — deploy.yml의 test job이 배포 전 게이트로 같은 검사를
# 이미 돌려서 커밋 하나당 중복 실행된다. PR 사전 검증 용도로만 남긴다(2026-09-01 정리).

on:
  pull_request:
    branches: [main]

jobs:
  check-build-output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: 의존성 설치
        run: npm ci
      - name: 빌드
        run: npm run build
      - name: index.html과 404.html이 동일한지 확인
        run: |
          if ! cmp -s dist/index.html dist/404.html; then
            echo "::error::dist/index.html과 dist/404.html이 다릅니다. vite.config.ts의 copy-index-to-404 플러그인을 확인하세요."
            exit 1
          fi
          echo "index.html과 404.html 동일함 — OK"
      - name: 산출물에 인라인 script가 없는지 확인
        run: python3 scripts/check-inline-script.py
