name: 배포 (테스트 통과 후 Firebase Hosting)

# 배포 이력: GitHub Pages(legacy → Actions 기반) → Firebase Hosting(2026-09-01) →
# React+TS+Vite 빌드 도입(2026-09-08). 이전엔 push하면 테스트 결과와 무관하게 무조건
# 배포됐지만, 지금은 아래 게이트를 전부 통과해야만 deploy job이 실행된다:
#   린트(eslint) → 빌드 → 산출물에 인라인 script 없음 → dist/index.html과 404.html
#   동일 → Playwright(재생 스모크 + LOCKED 기하 + 렌더 텍스트 덤프) → 폰트 서브셋
#   커버리지.
# "인라인 script 없음" 검사는 예전의 CSP 해시 검증을 대체한 것이다 — 빌드로 스크립트가
# 외부 파일로 빠져 해시를 맞출 대상이 사라졌지만, 인라인 스크립트가 다시 들어오면
# CSP(script-src 'self')가 조용히 차단하므로 그걸 막는 검사로 바꿔 남겼다.
# 폰트 커버리지는 2026-09-02부터 이 게이트 안에 있다 — 이전엔 별도 워크플로가 배포와
# 병렬로만 돌아서, 서브셋에 없는 글자를 추가한 커밋이 이슈가 열리기도 전에 먼저
# 라이브에 나갈 수 있었다.
# 배포 대상(dist/)은 저장소에 커밋하지 않으므로 test job과 deploy job이 각자 빌드한다.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: firebase-hosting-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: 의존성 설치
        run: npm ci
      - name: 린트
        run: npm run lint
      - name: 빌드
        run: npm run build
      - name: 산출물에 인라인 script가 없는지 확인
        run: python3 scripts/check-inline-script.py
      - name: index.html과 404.html이 동일한지 확인
        run: |
          if ! cmp -s dist/index.html dist/404.html; then
            echo "::error::dist/index.html과 dist/404.html이 다릅니다. 빌드가 복사를 못 한 것이니 vite.config.ts의 copy-index-to-404 플러그인을 확인하세요."
            exit 1
          fi
      - name: Playwright 브라우저 설치
        run: |
          # 2026-09-10에 Google 자체 Chrome apt 저장소가 "Hash Sum mismatch"를
          # 5연속으로 반환해 배포가 막혔다(우리 쪽 코드·설정과 무관, 외부 인프라
          # 문제). apt 로컬 캐시를 지우고 한 번 더 시도하는 건 이 증상의 표준
          # 대응이다 — 그래도 안 되면 그대로 실패시킨다(무한 재시도 안 함).
          npx playwright install --with-deps chromium || {
            echo "1차 설치 실패 — apt 캐시를 지우고 한 번 더 시도합니다"
            sudo rm -rf /var/lib/apt/lists/*
            sudo apt-get clean
            npx playwright install --with-deps chromium
          }
      - name: 테스트 (재생 스모크 + LOCKED 기하 + 렌더 텍스트 덤프)
        run: npm test
      - name: 실패 시 Playwright trace 업로드
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-trace
          path: test-results/
          retention-days: 7
      - name: Pretendard 서브셋 글자 커버리지 확인
        run: |
          pip install fonttools brotli
          python3 scripts/check-font-coverage.py

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # 배포 대상(dist/)은 저장소에 커밋되지 않으므로 여기서 다시 빌드한다.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: 의존성 설치
        run: npm ci
      - name: 빌드
        run: npm run build
      - id: deployment
        uses: FirebaseExtended/action-hosting-deploy@7c850a480ce753f4f06f010801fc5a43787740bb # v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EDUTOGETHER_PORTAL }}
          channelId: live
          projectId: edutogether-portal
      - name: 라이브 반영 확인
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "https://edutogether.kr/?ci_verify=$GITHUB_RUN_ID" | grep -q "같교오락실"; then
              echo "라이브에서 정상 콘텐츠 확인됨 (커밋 ${GITHUB_SHA:0:7})"
              exit 0
            fi
            echo "아직 반영 안 됨, 재시도 ($i/10)"
            sleep 6
          done
          echo "::error::배포는 성공했지만 라이브 페이지에서 예상 콘텐츠를 확인하지 못했습니다."
          exit 1
