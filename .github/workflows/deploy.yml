name: 배포 (테스트 통과 후 Firebase Hosting)

# 2026-08-29~09-01: GitHub Pages(legacy → Actions 기반) → Firebase Hosting
# 순으로 전환. 이전엔 push하면 테스트 결과와 무관하게 무조건 배포됐다가,
# Actions 기반 GitHub Pages로 바꾸면서 테스트 게이트가 생겼고, 이제는 배포
# 대상만 Firebase Hosting으로 바뀌었을 뿐 게이트는 그대로 유지한다: sync-check
# (index.html/404.html 동기화) + CSP 해시 검증 + 폰트 서브셋 커버리지 검증 +
# 재생 스모크 테스트가 전부 통과해야만 실제 배포가 진행된다(2026-09-02부터
# 폰트 커버리지 검사도 이 게이트 안으로 편입 — 이전엔 font-coverage-check.yml이
# 배포와 병렬로만 돌아서, 서브셋에 없는 글자를 추가한 커밋이 이슈가 열리기도
# 전에 먼저 라이브에 나갈 수 있었음).
# index.html 자체는 여전히 빌드 없는 정적 파일 — 여기서도 변환/번들링 없이
# 저장소 내용을 그대로 업로드만 한다.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: firebase-hosting-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: index.html과 404.html이 동일한지 확인
        run: |
          if ! cmp -s public/index.html public/404.html; then
            echo "::error::index.html과 404.html이 서로 다릅니다. index.html을 고쳤다면 'cp public/index.html public/404.html'을 잊은 것입니다."
            exit 1
          fi
      - name: CSP script-src 해시가 실제 스크립트와 일치하는지 확인
        run: python3 scripts/check-csp-hash.py
      - name: Pretendard 서브셋 글자 커버리지 확인
        run: |
          pip install fonttools brotli
          python3 scripts/check-font-coverage.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: 의존성 설치
        run: npm ci
      - name: Playwright 브라우저 설치
        run: npx playwright install --with-deps chromium
      - name: 재생 로직 스모크 테스트
        run: npx playwright test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: deployment
        uses: FirebaseExtended/action-hosting-deploy@7c850a480ce753f4f06f010801fc5a43787740bb # v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EDUTOGETHER_PORTAL }}
          channelId: live
          projectId: edutogether-portal
      - name: 라이브 반영 확인
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "https://edutogether.kr/?ci_verify=$GITHUB_RUN_ID" | grep -q "같교오락실"; then
              echo "라이브에서 정상 콘텐츠 확인됨 (커밋 ${GITHUB_SHA:0:7})"
              exit 0
            fi
            echo "아직 반영 안 됨, 재시도 ($i/10)"
            sleep 6
          done
          echo "::error::배포는 성공했지만 라이브 페이지에서 예상 콘텐츠를 확인하지 못했습니다."
          exit 1
