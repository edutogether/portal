name: 배포 (테스트 통과 후 Firebase Hosting)

# 배포 이력: GitHub Pages(legacy → Actions 기반) → Firebase Hosting(2026-09-01) →
# React+TS+Vite 빌드 도입(2026-09-08). 이전엔 push하면 테스트 결과와 무관하게 무조건
# 배포됐지만, 지금은 아래 게이트를 전부 통과해야만 deploy job이 실행된다:
#   린트(eslint) → 빌드 → 산출물에 인라인 script 없음 → dist/index.html과 404.html
#   동일 → Playwright(재생 스모크 + LOCKED 기하 + 렌더 텍스트 덤프) → 폰트 서브셋
#   커버리지.
# "인라인 script 없음" 검사는 예전의 CSP 해시 검증을 대체한 것이다 — 빌드로 스크립트가
# 외부 파일로 빠져 해시를 맞출 대상이 사라졌지만, 인라인 스크립트가 다시 들어오면
# CSP(script-src 'self')가 조용히 차단하므로 그걸 막는 검사로 바꿔 남겼다.
# 폰트 커버리지는 2026-09-02부터 이 게이트 안에 있다 — 이전엔 별도 워크플로가 배포와
# 병렬로만 돌아서, 서브셋에 없는 글자를 추가한 커밋이 이슈가 열리기도 전에 먼저
# 라이브에 나갈 수 있었다.
# 배포 대상(dist/)은 저장소에 커밋하지 않으므로 test job과 deploy job이 각자 빌드한다.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: firebase-hosting-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: 의존성 설치
        run: npm ci
      - name: 린트
        run: npm run lint
      - name: 빌드
        run: npm run build
      - name: 산출물에 인라인 script가 없는지 확인
        run: python3 scripts/check-inline-script.py
      - name: index.html과 404.html이 동일한지 확인
        run: |
          if ! cmp -s dist/index.html dist/404.html; then
            echo "::error::dist/index.html과 dist/404.html이 다릅니다. 빌드가 복사를 못 한 것이니 vite.config.ts의 copy-index-to-404 플러그인을 확인하세요."
            exit 1
          fi
      - name: Playwright 버전 확인
        id: playwright-version
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Playwright 브라우저 캐시
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
      - name: Playwright 브라우저 설치
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        # 2026-09-10에 Google 자체 Chrome apt 저장소가 "Hash Sum mismatch"를
        # 5연속 반환해 배포가 막혔다(우리 쪽 코드·설정과 무관, 외부 인프라 문제
        # — Voice Cinema가 자기 PC에서 같은 파일을 받아 해시를 대조해 확정함).
        # apt 로컬 캐시 삭제·저장소 목록 제거 재시도로 그때는 통과시켰지만,
        # 재시도는 그 저장소를 계속 타는 한 다음에 또 흔들리면 똑같이
        # 막힌다(임시방편, 헌법 §7). 근본 해법은 apt를 아예 안 타는 것 —
        # `--with-deps`가 시스템 공유 라이브러리를 apt로 까는 유일한 부분이라
        # 뗐다. GitHub ubuntu-latest 러너에는 Chromium 구동에 필요한 라이브러리가
        # 이미 대부분 있어서 브라우저 바이너리만(Playwright 자체 CDN에서 HTTPS로)
        # 받으면 된다 — 실제로 25개 테스트 전부 통과하는 것으로 확인했다.
        # 위 캐시가 맞으면 이 스텝 자체가 스킵돼 네트워크를 아예 안 탄다.
        run: npx playwright install chromium
      - name: 테스트 (재생 스모크 + LOCKED 기하 + 렌더 텍스트 덤프)
        run: npm test
      - name: 실패 시 Playwright trace 업로드
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-trace
          path: test-results/
          retention-days: 7
      - name: Pretendard 서브셋 글자 커버리지 확인
        run: |
          pip install fonttools brotli
          python3 scripts/check-font-coverage.py

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # 배포 대상(dist/)은 저장소에 커밋되지 않으므로 여기서 다시 빌드한다.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: 의존성 설치
        run: npm ci
      - name: 빌드
        run: npm run build
      - id: deployment
        uses: FirebaseExtended/action-hosting-deploy@7c850a480ce753f4f06f010801fc5a43787740bb # v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EDUTOGETHER_PORTAL }}
          channelId: live
          projectId: edutogether-portal
      - name: 라이브 반영 확인
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "https://edutogether.kr/?ci_verify=$GITHUB_RUN_ID" | grep -q "같교오락실"; then
              echo "라이브에서 정상 콘텐츠 확인됨 (커밋 ${GITHUB_SHA:0:7})"
              exit 0
            fi
            echo "아직 반영 안 됨, 재시도 ($i/10)"
            sleep 6
          done
          echo "::error::배포는 성공했지만 라이브 페이지에서 예상 콘텐츠를 확인하지 못했습니다."
          exit 1
