# Firebase CLI(firebase init hosting:github)로 자동 생성됨(2026-09-01).
# PR을 올리면 실제 라이브(edutogether.kr)와 별개인 임시 미리보기 URL에만
# 배포한다 — main 배포 게이트(deploy.yml)와는 무관하고 프로덕션에 영향 없음.
#
# 2026-10-05, 보안 스캔 지적(Medium)으로 job을 둘로 갈랐다. 예전엔 한 job 안에서
# PR 코드를 실행(npm ci·npm run build)한 뒤 같은 job에서 서비스계정 비밀
# (운영 배포 deploy.yml과 같은 비밀)으로 배포했다 — 빌드 단계가 $GITHUB_ENV·
# $GITHUB_PATH 등으로 뒤 단계를 오염시키면 비밀이 있는 단계에서 PR 코드가
# 실행될 수 있는 구조였다. 지금은:
#   build   — PR 코드를 실행한다. 비밀을 전혀 참조하지 않고 contents: read만 가진다.
#             결과물(dist/)만 artifact로 넘긴다.
#   preview — 비밀을 쓴다. PR 코드를 실행하지 않는다(npm ci·빌드·PR 스크립트 없음).
#             firebase.json도 PR 것이 아니라 base(main) 것을 쓴다 — PR이
#             predeploy 훅 같은 것을 firebase.json에 넣을 수 있기 때문이다.
# 동작은 그대로다: 같은 저장소 PR만, 미리보기 주소가 PR에 달린다.

name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  contents: read
jobs:
  build:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # 배포 대상(dist/)은 저장소에 커밋되지 않으므로 미리보기용으로도 빌드가 필요하다.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: 의존성 설치
        run: npm ci
      - name: 빌드
        run: npm run build
      - name: 빌드 산출물을 artifact로 올림
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preview-dist
          path: dist/
          # dist/가 비었는데 조용히 통과하면 빈 미리보기가 배포된다(§21-1).
          if-no-files-found: error
          retention-days: 1

  preview:
    needs: build
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
      # PR 것이 아니라 base(main) 것을 받는다 — firebase.json·.firebaserc를 PR이
      # 바꿔서 이 job(비밀이 있는)에서 뭔가 실행시키지 못하게 하려는 것이다.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: preview-dist
          path: dist
      - name: 받은 산출물 확인
        run: |
          if [ ! -s dist/index.html ]; then
            echo "::error::받은 artifact에 dist/index.html이 없거나 비어 있음 — 빈 미리보기를 배포하지 않는다."
            exit 1
          fi
      - uses: FirebaseExtended/action-hosting-deploy@7c850a480ce753f4f06f010801fc5a43787740bb # v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EDUTOGETHER_PORTAL }}
          projectId: edutogether-portal
