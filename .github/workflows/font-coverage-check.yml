name: Pretendard 서브셋 글자 커버리지 확인

# 자가호스팅된 Pretendard는 사이트가 실제 쓰는 글자만 서브셋해둔 상태(2026-08-25).
# 새 한글 텍스트(특히 새 가사)를 추가하고 재서브셋을 잊으면, 그 글자만 조용히
# 시스템 폰트로 폴백된다 — 이 워크플로우가 push/PR마다 미리 잡는다.
# 재서브셋 방법은 public/assets/fonts/pretendard/pretendard.css 상단 주석 참고.

permissions:
  contents: read
  issues: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: 의존성 설치
        run: npm ci
      - name: 빌드
        run: npm run build
      - name: Playwright 버전 확인
        id: playwright-version
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Playwright 브라우저 캐시
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
      - name: Playwright 브라우저 설치
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        # deploy.yml과 같은 이유로 --with-deps를 뗐다(2026-09-10) — apt는 시스템
        # 라이브러리에만 쓰이는데 ubuntu-latest에는 이미 대부분 있고, 브라우저
        # 바이너리는 Playwright 자체 CDN에서 HTTPS로 받는다. 자세한 경위는
        # .claude/rules/app.md 참고.
        run: npx playwright install chromium
      # 검사 대상 글자는 실제로 그려진 DOM에서 뽑는다(소스를 훑으면 코드 식별자까지
      # 사용 글자로 잡힌다) — 이 테스트가 .cache/rendered-text.txt를 만든다.
      - name: 렌더된 텍스트 덤프
        run: npx playwright test --grep @fonttext
      - name: fonttools 설치
        run: pip install fonttools brotli
      - name: 글자 커버리지 확인
        run: |
          python3 scripts/check-font-coverage.py > /tmp/coverage-output.txt 2>&1
          code=$?
          cat /tmp/coverage-output.txt
          exit $code

      - name: 실패 시 GitHub 이슈 자동 생성
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # link-healthcheck.yml과 같은 패턴 — 이미 열린 실패 이슈가 있으면
          # push/PR마다 새로 만들지 않는다.
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label font-coverage-failure --state open --json number --jq 'length')
          if [ "$existing" -gt 0 ]; then
            echo "이미 열린 폰트 커버리지 실패 이슈가 있어 새로 만들지 않음"
            exit 0
          fi
          {
            echo "Pretendard 서브셋 글자 커버리지 확인이 실패했습니다. [실행 로그]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo ""
            cat /tmp/coverage-output.txt
          } > /tmp/issue-body.txt
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "🔴 Pretendard 폰트 커버리지 실패 ($(date -u +%Y-%m-%d))" \
            --label font-coverage-failure \
            --assignee 817beatles \
            --body-file /tmp/issue-body.txt
